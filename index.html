<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#241b3d"><title>Fairy Kingdom Defense</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17152b;color:#fff;font-family:system-ui,-apple-system,sans-serif}#app{max-width:900px;margin:auto;padding:12px;display:grid;gap:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;color:#ffd8ef}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#302849;border:1px solid #57456f;padding:7px 11px;border-radius:12px;font-weight:800;font-size:13px}.board{position:relative;border:2px solid #69517f;border-radius:18px;overflow:hidden;background:#293e46;box-shadow:0 12px 35px #09081788}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tool{background:#302849;border:1px solid #65517d;color:white;border-radius:13px;padding:10px 4px;font-weight:800;cursor:pointer}.tool small{display:block;color:#d9c5ee;font-size:11px;margin-top:3px}.tool.active{background:#8c4e9d;border-color:#ffc4e8}.tool:disabled{opacity:.45}.bottom{background:#29233e;border:1px solid #514365;border-radius:14px;padding:11px;min-height:55px;font-size:13px;line-height:1.5}.bottom b{color:#ffd3ed}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:12px;padding:10px 14px;font-weight:900;background:#ed9acb;color:#351b3c}.actions button.secondary{background:#4b3d60;color:#fff}.hint{color:#c9b9dc;font-size:12px}@media(max-width:480px){#app{padding:8px}.brand{font-size:17px}.pill{font-size:12px;padding:6px 8px}.tool{font-size:12px;padding:9px 2px}}
</style></head><body><main id="app">
<div class="top"><div class="brand">🌸 FAIRY KINGDOM DEFENSE</div><div class="stats"><div class="pill">💰 <span id="gold">220</span></div><div class="pill">❤️ <span id="life">15</span></div><div class="pill">🌊 <span id="wave">0/8</span></div></div></div>
<div class="board"><canvas id="game" width="720" height="570"></canvas></div>
<div class="toolbar">
<button class="tool" data-type="archer">🏹 궁수<small>70G · 빠른 공격</small></button>
<button class="tool" data-type="mage">🔮 마법사<small>100G · 강한 공격</small></button>
<button class="tool" data-type="cannon">💣 포병<small>120G · 범위 공격</small></button>
<button class="tool" data-type="hero">👑 영웅 소환<small>150G · 특수 공격</small></button>
</div>
<div class="actions"><button id="waveBtn">▶ 웨이브 시작</button><button id="skillBtn" class="secondary">✨ 요정의 축복</button><button id="upgradeBtn" class="secondary">⬆ 선택 타워 강화</button><button id="resetBtn" class="secondary">↻ 다시하기</button></div>
<div class="bottom" id="msg"><b>수호자 여러분, 왕국을 지켜주세요!</b><br>타워 종류를 고른 다음 길 주변의 빈 땅을 눌러 설치하세요. 타워를 누르면 선택되고, 강화 버튼으로 업그레이드할 수 있어요.</div>
<div class="hint">팁: 타워는 자동 공격합니다. 몬스터를 처치하면 골드를 얻어요. 영웅은 주변 적을 직접 공격합니다.</div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id);
const W=720,H=570,path=[[-20,95],[180,95],[180,220],[520,220],[520,390],[220,390],[220,500],[740,500]];
const defs={archer:{cost:70,range:145,rate:.55,dmg:19,color:'#83d8c1',name:'궁수'},mage:{cost:100,range:160,rate:1.05,dmg:43,color:'#c6a1ff',name:'마법사'},cannon:{cost:120,range:130,rate:1.5,dmg:57,color:'#ffbd83',name:'포병'},hero:{cost:150,range:185,rate:.72,dmg:31,color:'#ff9ecb',name:'영웅'}};
let gold=220,life=15,wave=0, towers=[],enemies=[],shots=[],particles=[],selected=null,placing=null,active=false,spawnTimer=0,spawned=0,total=0,skill=0,ended=false,won=false,last=0,raf;
const girls=[['리리','🌸','#f4a7ca'],['루나','🌙','#b8a6fa'],['미엘','🍯','#f4c77c'],['세라','🪽','#9bd8ee'],['로제','🌹','#e88b9f'],['엘리','✨','#b4dca6']];
function pathPoint(d){for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){let t=d/l;return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t};}d-=l;}return{x:740,y:500}}
const pathLen=path.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-path[i][0],p[1]-path[i][1]),0);
function nearPath(x,y){let best=999;for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy)));best=Math.min(best,Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy));}return best}
function ui(){ $('gold').textContent=gold;$('life').textContent=life;$('wave').textContent=wave+'/8';$('waveBtn').disabled=active||ended||won||wave>=8;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',placing===b.dataset.type));$('upgradeBtn').disabled=!selected||gold<(selected.level*55)||ended; }
function say(a,b=''){ $('msg').innerHTML='<b>'+a+'</b>'+(b?'<br>'+b:'') }
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{placing=placing===b.dataset.type?null:b.dataset.type;selected=null;ui();say('설치할 위치를 선택하세요',defs[b.dataset.type].name+' 타워 · '+defs[b.dataset.type].cost+' 골드')});
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let hit=[...towers].reverse().find(t=>Math.hypot(t.x-x,t.y-y)<25);if(hit){selected=hit;placing=null;ui();say(hit.name+' · 레벨 '+hit.level,'강화 비용 '+(hit.level*55)+' 골드');return}if(placing){let d=defs[placing];if(gold<d.cost){say('골드가 부족해요!');return}if(nearPath(x,y)<48||towers.some(t=>Math.hypot(t.x-x,t.y-y)<48)){say('이곳에는 설치할 수 없어요.','길에서 조금 떨어진 빈 땅을 선택하세요.');return}let name=placing==='hero'?girls[towers.filter(t=>t.type==='hero').length%girls.length][0]+' 공주':d.name;let color=placing==='hero'?girls[towers.filter(t=>t.type==='hero').length%girls.length][2]:d.color;towers.push({x,y,type:placing,name,color,level:1,range:d.range,rate:d.rate,dmg:d.dmg,cool:0,angle:0});gold-=d.cost;selected=towers[towers.length-1];placing=null;say(name+' 등장!','왕국의 수호자가 되었어요 💖');ui();return}selected=null;ui()});
$('upgradeBtn').onclick=()=>{if(!selected)return;let cost=selected.level*55;if(gold<cost){say('골드가 부족해요!');return}gold-=cost;selected.level++;selected.dmg=Math.round(selected.dmg*1.55);selected.range+=12;selected.rate*=.92;say(selected.name+' 강화 완료!','레벨 '+selected.level+' · 공격력이 강해졌어요.');ui()};
$('waveBtn').onclick=()=>{if(active||ended||won)return;wave++;total=7+wave*3;spawned=0;spawnTimer=.2;active=true;say('웨이브 '+wave+' 시작!','몬스터들이 몰려옵니다!');ui()};
$('skillBtn').onclick=()=>{if(skill>0){say('요정의 축복은 재사용 대기 중이에요.');return}skill=18;enemies.forEach(e=>{e.hp-=75;burst(e.x,e.y,'#ffe88c',8)});say('✨ 요정의 축복 발동!','모든 몬스터에게 마법 피해를 줬어요.');};
$('resetBtn').onclick=()=>{gold=220;life=15;wave=0;towers=[];enemies=[];shots=[];particles=[];selected=null;placing=null;active=false;spawned=0;total=0;skill=0;ended=false;won=false;say('새로운 모험이 시작됐어요!','타워를 설치하고 왕국을 지켜주세요.');ui()};
function burst(x,y,color,n=6){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5,color})}}
function spawn(){let boss=wave%3===0&&spawned===total-1,hp=(24+wave*12)*(boss?4:1);enemies.push({d:0,hp,max:hp,speed:(boss?35:48+wave*2),boss,r:boss?19:12,skin:['#e98ba8','#9d91db','#e8b36c','#82c9b6'][Math.floor(Math.random()*4)],dead:false});spawned++}
function update(dt){if(skill>0)skill-=dt;if(active&&!ended&&!won){spawnTimer-=dt;if(spawned<total&&spawnTimer<=0){spawn();spawnTimer=.75+Math.random()*.25}for(let e of enemies){e.d+=e.speed*dt;let p=pathPoint(e.d);e.x=p.x;e.y=p.y;if(e.d>=pathLen&&!e.dead){e.dead=true;life-=e.boss?4:1;burst(e.x,e.y,'#ff7777',10)}}if(life<=0){life=0;ended=true;active=false;say('왕국이 위험에 빠졌어요…','다시하기를 눌러 재도전하세요.')}for(let t of towers){t.cool-=dt;let target=enemies.filter(e=>!e.dead&&e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<t.range).sort((a,b)=>b.d-a.d)[0];if(target&&t.cool<=0){let a=Math.atan2(target.y-t.y,target.x-t.x);shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,target,speed:t.type==='mage'?390:480,dmg:t.dmg*(t.type==='hero'&&skill>0?1.5:1),type:t.type,color:t.color});t.cool=t.rate;}}}
for(let s of shots){if(!s.target.dead){s.tx=s.target.x;s.ty=s.target.y}let dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),step=s.speed*dt;if(d<step+5){if(s.type==='cannon'){enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-s.tx,e.y-s.ty)<48)e.hp-=s.dmg*.65})}else s.target.hp-=s.dmg;burst(s.tx,s.ty,s.color,4);s.dead=true}else{s.x+=dx/d*step;s.y+=dy/d*step}}shots=shots.filter(s=>!s.dead);for(let e of enemies){if(e.hp<=0&&!e.dead){e.dead=true;gold+=e.boss?65:12;burst(e.x,e.y,e.skin,9)}}enemies=enemies.filter(e=>!e.dead);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(active&&spawned>=total&&enemies.length===0){active=false;if(wave===8){won=true;say('🏆 왕국을 구했어요!','모든 웨이브를 막아낸 전설의 수호자!')}else say('웨이브 '+wave+' 방어 성공!','골드를 모아 다음 공격에 대비하세요.')}ui()}
function girl(x,y,color,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);g.fillStyle='#34263f';g.beginPath();g.ellipse(0,8,14,18,0,0,Math.PI*2);g.fill();g.fillStyle=color;g.beginPath();g.arc(0,-7,12,0,Math.PI*2);g.fill();g.fillStyle='#ffe1d4';g.beginPath();g.arc(0,-7,9,0,Math.PI*2);g.fill();g.fillStyle=color;g.beginPath();g.arc(-3,-12,8,3.2,6.2);g.arc(5,-12,7,3.3,6.2);g.fill();g.fillStyle='#47314b';g.beginPath();g.arc(-3,-6,1.2,0,7);g.arc(4,-6,1.2,0,7);g.fill();g.strokeStyle='#c56b91';g.lineWidth=1;g.beginPath();g.arc(1,-2,2,0,Math.PI);g.stroke();g.fillStyle='#fff';g.beginPath();g.ellipse(-13,1,5,10,-.4,0,7);g.ellipse(13,1,5,10,.4,0,7);g.fill();g.restore()}
function draw(){g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a7d9c8');sky.addColorStop(1,'#6eaa91');g.fillStyle=sky;g.fillRect(0,0,W,H);for(let i=0;i<35;i++){let x=(i*97)%W,y=(i*67)%H;g.fillStyle=i%2?'#d5edb0':'#f8d7ed';g.globalAlpha=.5;g.beginPath();g.arc(x,y,2+(i%3),0,7);g.fill()}g.globalAlpha=1;
// path
 g.lineCap='round';g.lineJoin='round';g.beginPath();path.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle='#9b795e';g.lineWidth=66;g.stroke();g.strokeStyle='#e5c99e';g.lineWidth=56;g.stroke();g.setLineDash([12,14]);g.strokeStyle='#c8a77c';g.lineWidth=2;g.stroke();g.setLineDash([]);
// decorative trees and flowers
for(let [x,y] of [[35,175],[75,280],[300,70],[430,115],[650,150],[635,300],[370,460],[90,460],[300,300],[610,450]]){g.fillStyle='#725b54';g.fillRect(x-4,y,8,18);g.fillStyle='#387e68';g.beginPath();g.arc(x,y,20,0,7);g.fill();g.fillStyle='#6fae83';g.beginPath();g.arc(x-7,y-7,11,0,7);g.fill()}
// castle and gate
 g.font='48px serif';g.fillText('🏰',18,65);g.fillText('🚩',655,470);
for(let t of towers){g.beginPath();g.arc(t.x,t.y,t.range,0,7);g.fillStyle=selected===t?'#fff4a622':'#fff4a610';g.fill();g.fillStyle='#5a476c';g.beginPath();g.arc(t.x,t.y,23,0,7);g.fill();g.strokeStyle=t.color;g.lineWidth=4;g.stroke();if(t.type==='hero'){girl(t.x,t.y-3,t.color,1.25);g.font='15px serif';g.fillText('👑',t.x+13,t.y-17)}else{g.font='27px serif';g.textAlign='center';g.fillText(t.type==='archer'?'🏹':t.type==='mage'?'🔮':'💣',t.x,t.y+9)}g.fillStyle='#fff';g.font='bold 11px sans-serif';g.fillText('Lv.'+t.level,t.x,t.y+37);}
for(let e of enemies){g.fillStyle='#492d4a';g.beginPath();g.ellipse(e.x,e.y+5,e.r+3,e.r,0,0,7);g.fill();g.fillStyle=e.skin;g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(e.x-4,e.y-2,3,0,7);g.arc(e.x+4,e.y-2,3,0,7);g.fill();g.fillStyle='#34223c';g.beginPath();g.arc(e.x-4,e.y-2,1.3,0,7);g.arc(e.x+4,e.y-2,1.3,0,7);g.fill();g.fillStyle='#43253d';g.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);g.fillStyle='#72df85';g.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),4);if(e.boss){g.fillStyle='#fff';g.font='17px serif';g.fillText('👑',e.x,e.y-23)}}
for(let s of shots){g.fillStyle=s.color;g.beginPath();g.arc(s.x,s.y,s.type==='cannon'?6:4,0,7);g.fill();g.shadowBlur=12;g.shadowColor=s.color;g.fill();g.shadowBlur=0}for(let p of particles){g.globalAlpha=Math.max(0,p.life*2);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()}g.globalAlpha=1;
if(placing){g.fillStyle='#352744cc';g.fillRect(190,8,340,32);g.fillStyle='white';g.font='bold 16px sans-serif';g.textAlign='center';g.fillText('설치할 위치를 터치하세요',360,30)}if(ended||won){g.fillStyle='#21172dcc';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='bold 38px sans-serif';g.fillText(won?'✨ VICTORY ✨':'GAME OVER',360,260);g.font='19px sans-serif';g.fillText(won?'요정 왕국의 평화가 찾아왔어요!':'왕국을 다시 지켜주세요!',360,300)}}
function loop(ts){if(!document.body.contains(c))return;let dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);draw();raf=requestAnimationFrame(loop)}ui();raf=requestAnimationFrame(loop);
})();
</script></body></html>
